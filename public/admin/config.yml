backend:
  name: github
  repo: jeffryj11/goddome
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "stories"
    label: "Devotionals & Stories"
    folder: "content/stories"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string", default: "Devotional" }
      - { label: "Author", name: "author", widget: "string", default: "Jeanna’ Mead" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", dateFormat: "YYYY-MM-DD", timeFormat: false }
      - { label: "Read Time", name: "readTime", widget: "string", default: "8 min read" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
